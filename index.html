<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEE Virtual Lab — Interactive Basic Electrical Engineering Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#10172b; --card:#141c33; --card2:#1a2440; --line:#26314f;
  --text:#e6ebf5; --muted:#8d99b8; --amber:#ffb84d; --cyan:#4fd1e8; --green:#5be49b;
  --pink:#ff6b9a; --violet:#a78bfa; --red:#ff6b6b;
  --wire:#9fb0d6;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px,#1a2340 1px,transparent 0);background-size:22px 22px}
a{color:var(--cyan)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav.side{background:rgba(11,16,32,.92);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;backdrop-filter:blur(6px)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--pink));display:grid;place-items:center;color:#1a1020;font-weight:700}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:12px}
.navgrp{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.4px;margin:14px 10px 6px}
.navlink{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-size:14px;cursor:pointer;border:1px solid transparent}
.navlink:hover{background:var(--card)}
.navlink.on{background:var(--card2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--amber)}
.navlink .ic{width:22px;text-align:center;color:var(--amber);font-family:var(--mono);font-size:13px}
main{padding:26px 30px 60px;max-width:1400px;width:100%}
.menu-btn{display:none}
h1,h2,h3{margin:0;font-weight:600}
.mhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
.mhead h2{font-size:28px}
.mhead .tag{color:var(--amber);font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.mhead p{color:var(--muted);margin:6px 0 0;max-width:780px}
.card{background:linear-gradient(180deg,var(--card),#121a30);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.g-top{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-bottom:16px}
.g-bot{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.ctl{display:flex;flex-direction:column;gap:12px}
.prm label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.prm label b{color:var(--text);font-weight:500}
.prm .row{display:flex;gap:8px;align-items:center}
.prm input[type=range]{flex:1;accent-color:var(--amber);height:4px}
.prm input[type=number]{width:86px;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 7px;font-family:var(--mono);font-size:13px}
.prm input[type=number]:focus,.prm select:focus{outline:1px solid var(--amber)}
.prm .u{color:var(--muted);font-size:12px;width:34px;font-family:var(--mono)}
.prm select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px;font-family:var(--sans);font-size:14px}
.prm.hide{display:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13px}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);color:#1b1407;border-color:var(--amber);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:9px;border:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer;font-family:var(--sans);font-size:13px}
.tabs button.on{background:var(--card2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.vizhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.viz svg{width:100%;height:auto;display:block}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.res{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.res small{color:var(--muted);font-size:12px;display:block}
.res b{font-family:var(--mono);font-size:18px;font-weight:500}
.res.hl{border-color:rgba(255,184,77,.55);background:linear-gradient(180deg,rgba(255,184,77,.10),var(--bg2))}
.res.hl b{color:var(--amber)}
.res.ok b{color:var(--green)}
.res.warn{border-color:rgba(255,107,107,.6)} .res.warn b{color:var(--red)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;border-left:1px dashed var(--line);margin-left:12px}
ol.steps li:last-child{border-left-color:transparent}
ol.steps li::before{content:counter(s);position:absolute;left:-13px;top:0;width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--amber);color:var(--amber);display:grid;place-items:center;font-size:12px;font-family:var(--mono)}
ol.steps .t{font-weight:500;margin-bottom:4px;padding-top:2px}
ol.steps .f{font-family:var(--mono);font-size:12.5px;color:#c9d4ee;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-x:auto}
canvas{width:100%;height:270px;display:block}
.chartwrap+.chartwrap{margin-top:14px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.theory{margin-top:16px}
.theory summary{cursor:pointer;font-weight:500}
.theory .f{font-family:var(--mono);font-size:13px;color:#c9d4ee;margin-top:10px;white-space:pre-wrap;line-height:1.7}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th,table.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.tb th{color:var(--muted);font-weight:500}
table.tb td{font-family:var(--mono)}
/* svg */
.w{fill:none;stroke:var(--wire);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cmp{fill:none;stroke:var(--text);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.cmp.load{stroke:var(--green)}
.cmp.hot{stroke:var(--amber)}
.src{fill:var(--bg2);stroke:var(--cyan);stroke-width:2.2}
.st{fill:var(--text);font-family:var(--sans);font-size:14px}
.sv{fill:var(--amber);font-family:var(--mono);font-size:12px}
.sm{fill:var(--muted);font-family:var(--mono);font-size:11px}
.sc{fill:var(--cyan);font-family:var(--mono);font-size:12px}
.sg{fill:var(--green);font-family:var(--mono);font-size:12px}
.node{fill:var(--wire)}
.term{fill:var(--bg);stroke:var(--wire);stroke-width:2}
.flow{fill:none;stroke:var(--amber);stroke-width:3.2;stroke-dasharray:2 14;stroke-linecap:round;animation:flow linear infinite;opacity:.95}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes spin{to{transform:rotate(360deg)}}
/* home */
.hero{padding:30px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,184,77,.13),rgba(79,209,232,.08) 60%,transparent),var(--card);position:relative;overflow:hidden}
.hero h1{font-size:40px;line-height:1.1;max-width:720px}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:var(--muted);max-width:680px;font-size:16px}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:14px}
.hero .meta span{color:var(--muted)}
.hero .meta [contenteditable]{color:var(--text);border-bottom:1px dashed var(--line);outline:none;padding:0 2px}
.hero svg.wave{position:absolute;right:-20px;bottom:-10px;width:420px;opacity:.5}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.mc:hover{border-color:var(--amber);transform:translateY(-2px)}
.mc .k{font-family:var(--mono);color:var(--amber);font-size:12px}
.mc h3{margin:6px 0;font-size:17px}
.mc p{color:var(--muted);margin:0;font-size:13.5px}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}
.feat div{border-left:2px solid var(--amber);padding:4px 12px}
.feat b{display:block}
.feat span{color:var(--muted);font-size:13.5px}
@media (max-width:1100px){.g-top{grid-template-columns:1fr}.g-bot{grid-template-columns:1fr}}
@media (max-width:800px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;z-index:20;width:260px;transform:translateX(-100%);transition:.2s}
  nav.side.open{transform:none}
  .menu-btn{display:inline-block;margin-bottom:14px}
  main{padding:16px}
  .hero h1{font-size:30px}
}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="side"></nav>
<main>
  <button class="btn menu-btn" id="menuBtn">☰ Modules</button>
  <div id="view"></div>
</main>
</div>

<script>
/* ====================== Utilities ====================== */
const $ = id => document.getElementById(id);
const PI = Math.PI, DEG = 180/PI;
function eng(v,u='',d=4){
  if(v===Infinity) return '∞ '+u;
  if(v===-Infinity) return '−∞ '+u;
  if(!isFinite(v)) return '—';
  if(Math.abs(v)<1e-12) return '0 '+u;
  const a=Math.abs(v);
  const P=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']];
  for(const [m,p] of P){ if(a>=m*0.99995){ return fmtNum(v/m,d)+' '+p+u; } }
  return fmtNum(v/1e-9,d)+' n'+u;
}
function fmtNum(x,d=4){ const s=(+x.toPrecision(d)).toString(); return s.replace('-','−'); }
function fx(v,dp=2){ return isFinite(v)? v.toFixed(dp).replace('-','−') : '—'; }
const n4 = v => fmtNum(v,4);
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ====================== SVG helpers ====================== */
const S = {
  wire:(pts)=>`<polyline class="w" points="${pts.map(p=>p.join(',')).join(' ')}"/>`,
  flow(pts,I,Iref){
    if(!isFinite(I)||Math.abs(I)<1e-9||!Iref) return '';
    const dur=Math.min(4,Math.max(0.18,0.5*Iref/Math.abs(I)));
    return `<polyline class="flow" points="${pts.map(p=>p.join(',')).join(' ')}" style="animation-duration:${dur}s;animation-direction:${I>0?'normal':'reverse'}"/>`;
  },
  node:(x,y)=>`<circle class="node" cx="${x}" cy="${y}" r="4"/>`,
  term:(x,y,l)=>`<circle class="term" cx="${x}" cy="${y}" r="5"/>`+(l?`<text class="st" x="${x}" y="${y-12}" text-anchor="middle" font-weight="600">${l}</text>`:''),
  res(x1,y1,x2,y2,name,val,cls='',side=1){
    const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,px=-uy,py=ux;
    const zl=Math.min(64,L*0.6),s=(L-zl)/2,n=6;
    const pts=[[x1,y1],[x1+ux*s,y1+uy*s]];
    for(let i=1;i<=n;i++){const t=s+zl*(i-0.5)/n,sg=i%2?1:-1;pts.push([x1+ux*t+px*9*sg,y1+uy*t+py*9*sg]);}
    pts.push([x1+ux*(s+zl),y1+uy*(s+zl)],[x2,y2]);
    const mx=(x1+x2)/2,my=(y1+y2)/2,horiz=Math.abs(ux)>Math.abs(uy);
    let lab='';
    if(horiz){ const yy=my-24*side; lab=`<text class="st" x="${mx}" y="${side>0?yy-14:yy+4}" text-anchor="middle">${name}</text><text class="sv" x="${mx}" y="${side>0?yy:yy+18}" text-anchor="middle">${val}</text>`; }
    else { const xx=mx+20*side; lab=`<text class="st" x="${xx}" y="${my-4}" text-anchor="${side>0?'start':'end'}">${name}</text><text class="sv" x="${xx}" y="${my+13}" text-anchor="${side>0?'start':'end'}">${val}</text>`; }
    return `<polyline class="cmp ${cls}" points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`+lab;
  },
  vs(x,yT,yB,name,val,side=-1){
    const cy=(yT+yB)/2,r=21;
    return `<g class="top"><line class="w" x1="${x}" y1="${yT}" x2="${x}" y2="${cy-r}"/><line class="w" x1="${x}" y1="${cy+r}" x2="${x}" y2="${yB}"/>
    <circle class="src" cx="${x}" cy="${cy}" r="${r}"/><text class="sc" x="${x}" y="${cy-5}" text-anchor="middle" font-size="15">+</text><text class="sc" x="${x}" y="${cy+14}" text-anchor="middle" font-size="15">−</text>
    <text class="st" x="${x+(r+8)*side}" y="${cy-4}" text-anchor="${side<0?'end':'start'}">${name}</text><text class="sv" x="${x+(r+8)*side}" y="${cy+13}" text-anchor="${side<0?'end':'start'}">${val}</text></g>`;
  },
  is(x,yT,yB,name,val,side=-1){
    const cy=(yT+yB)/2,r=21;
    return `<g class="top"><line class="w" x1="${x}" y1="${yT}" x2="${x}" y2="${cy-r}"/><line class="w" x1="${x}" y1="${cy+r}" x2="${x}" y2="${yB}"/>
    <circle class="src" cx="${x}" cy="${cy}" r="${r}"/><path d="M${x} ${cy+11} L${x} ${cy-9} M${x-6} ${cy-3} L${x} ${cy-11} L${x+6} ${cy-3}" stroke="var(--cyan)" stroke-width="2.2" fill="none"/>
    <text class="st" x="${x+(r+8)*side}" y="${cy-4}" text-anchor="${side<0?'end':'start'}">${name}</text><text class="sv" x="${x+(r+8)*side}" y="${cy+13}" text-anchor="${side<0?'end':'start'}">${val}</text></g>`;
  },
  ind(x1,x2,y,name,val){
    const L=x2-x1,cl=Math.min(70,L*0.6),s=x1+(L-cl)/2,n=4,w=cl/n;
    let d=`M${x1} ${y} L${s} ${y}`;
    for(let i=0;i<n;i++) d+=` A${w/2} ${w/2} 0 0 1 ${s+w*(i+1)} ${y}`;
    d+=` L${x2} ${y}`;
    const mx=(x1+x2)/2;
    return `<path class="cmp" d="${d}"/><text class="st" x="${mx}" y="${y-38}" text-anchor="middle">${name}</text><text class="sv" x="${mx}" y="${y-24}" text-anchor="middle">${val}</text>`;
  },
  cap(x1,x2,y,name,val){
    const mx=(x1+x2)/2;
    return `<line class="w" x1="${x1}" y1="${y}" x2="${mx-6}" y2="${y}"/><line class="w" x1="${mx+6}" y1="${y}" x2="${x2}" y2="${y}"/>
    <line class="cmp" x1="${mx-6}" y1="${y-16}" x2="${mx-6}" y2="${y+16}"/><line class="cmp" x1="${mx+6}" y1="${y-16}" x2="${mx+6}" y2="${y+16}"/>
    <text class="st" x="${mx}" y="${y-38}" text-anchor="middle">${name}</text><text class="sv" x="${mx}" y="${y-24}" text-anchor="middle">${val}</text>`;
  },
  arrow(x1,y1,x2,y2,color,w=2.5,label='',lcls='sv'){
    const a=Math.atan2(y2-y1,x2-x1),h=10;
    const p1=[x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4)],p2=[x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4)];
    const lx=x2+14*Math.cos(a),ly=y2+14*Math.sin(a)+4;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x2},${y2} ${p1.join(',')} ${p2.join(',')}" fill="${color}"/>`+
      (label?`<text class="${lcls}" x="${lx}" y="${ly}" text-anchor="${Math.cos(a)>0.3?'start':Math.cos(a)<-0.3?'end':'middle'}" fill="${color}">${label}</text>`:'');
  },
  loop(cx,cy,r,label,cw=true){
    const a0=-PI*0.75,a1=PI*0.6;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const tang=a1+PI/2,h=9;
    return `<path d="M${x0} ${y0} A${r} ${r} 0 1 1 ${x1} ${y1}" fill="none" stroke="var(--violet)" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="${x1},${y1} ${x1-h*Math.cos(tang-0.45)},${y1-h*Math.sin(tang-0.45)} ${x1-h*Math.cos(tang+0.45)},${y1-h*Math.sin(tang+0.45)}" fill="var(--violet)"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="var(--violet)">${label}</text>`;
  },
  gnd(x,y){return `<line class="w" x1="${x}" y1="${y}" x2="${x}" y2="${y+12}"/><line class="w" x1="${x-12}" y1="${y+12}" x2="${x+12}" y2="${y+12}"/><line class="w" x1="${x-7}" y1="${y+17}" x2="${x+7}" y2="${y+17}"/><line class="w" x1="${x-3}" y1="${y+22}" x2="${x+3}" y2="${y+22}"/>`;},
  txt:(x,y,t,cls='st',anchor='middle')=>`<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${t}</text>`,
  svg:(w,h,inner)=>{ const tops=inner.match(/<g class="top">[\s\S]*?<\/g>/g)||[]; inner=inner.replace(/<g class="top">[\s\S]*?<\/g>/g,''); return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}${tops.join('')}</svg>`; }
};

/* ====================== Charts (canvas) ====================== */
function niceTicks(min,max,n=5){
  const span=(max-min)||1, st0=span/n, mag=10**Math.floor(Math.log10(st0)), r=st0/mag;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*mag, t=[];
  for(let v=Math.ceil(min/step-1e-9)*step; v<=max+step*1e-9; v+=step) t.push(+v.toPrecision(12));
  return t;
}
function prepCanvas(cv){
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr; const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h); return {c,w,h};
}
function lineChart(cv,o){
  if(!cv) return;
  const {c,w,h}=prepCanvas(cv); const m={l:58,r:16,t:26,b:42};
  const pw=w-m.l-m.r, ph=h-m.t-m.b;
  const tx=o.logx?(v=>Math.log10(v)):(v=>v);
  let xmin=tx(o.x[0]), xmax=tx(o.x[o.x.length-1]);
  let ys=o.series.flatMap(s=>s.y).filter(isFinite);
  if(o.markers) ys=ys.concat(o.markers.map(k=>k.y).filter(isFinite));
  let ymin=o.ymin!==undefined?o.ymin:Math.min(0,...ys), ymax=o.ymax!==undefined?o.ymax:Math.max(...ys);
  if(ymax===ymin) ymax=ymin+1;
  const pad=(ymax-ymin)*0.08; if(o.ymax===undefined) ymax+=pad; if(o.ymin===undefined && ymin<0) ymin-=pad;
  const X=v=>m.l+(tx(v)-xmin)/(xmax-xmin)*pw, Y=v=>m.t+(1-(v-ymin)/(ymax-ymin))*ph;
  c.font='11px "JetBrains Mono", ui-monospace, monospace'; c.strokeStyle='#26314f'; c.fillStyle='#8d99b8'; c.lineWidth=1;
  // y grid
  for(const t of niceTicks(ymin,ymax,5)){ const y=Y(t); c.beginPath(); c.moveTo(m.l,y); c.lineTo(w-m.r,y); c.stroke(); c.textAlign='right'; c.fillText(eng(t,'',3).trim(),m.l-6,y+4); }
  // x grid
  let xt;
  if(o.logx){ xt=[]; for(let e=Math.floor(xmin);e<=Math.ceil(xmax);e++) for(const k of [1,2,5]){const v=k*10**e; if(Math.log10(v)>=xmin-1e-9&&Math.log10(v)<=xmax+1e-9) xt.push(v);} }
  else xt=niceTicks(xmin,xmax,6);
  for(const t of xt){ const x=X(t); c.beginPath(); c.moveTo(x,m.t); c.lineTo(x,m.t+ph); c.stroke(); c.textAlign='center'; c.fillText(eng(t,'',3).trim(),x,m.t+ph+15); }
  // zero line
  if(ymin<0&&ymax>0){ c.strokeStyle='#4a5a85'; c.beginPath(); c.moveTo(m.l,Y(0)); c.lineTo(w-m.r,Y(0)); c.stroke(); }
  // axes labels
  c.fillStyle='#8d99b8'; c.font='12px "Space Grotesk", system-ui, sans-serif'; c.textAlign='center';
  c.fillText(o.xl||'',m.l+pw/2,h-6);
  c.save(); c.translate(13,m.t+ph/2); c.rotate(-PI/2); c.fillText(o.yl||'',0,0); c.restore();
  // vlines
  (o.vlines||[]).forEach(v=>{ if(!isFinite(v.x)) return; const x=X(v.x); if(x<m.l||x>w-m.r) return; c.strokeStyle=v.color; c.setLineDash([4,4]); c.beginPath(); c.moveTo(x,m.t); c.lineTo(x,m.t+ph); c.stroke(); c.setLineDash([]); c.fillStyle=v.color; c.font='11px "JetBrains Mono", ui-monospace, monospace'; c.textAlign='left'; c.fillText(v.label||'',Math.min(x+5,w-m.r-90),m.t+ph-8); });
  // series
  c.save(); c.beginPath(); c.rect(m.l,m.t,pw,ph); c.clip();
  o.series.forEach(s=>{ c.strokeStyle=s.color; c.lineWidth=s.w||2.2; c.setLineDash(s.dash||[]); c.beginPath(); let st=false;
    o.x.forEach((xv,i)=>{ const yv=s.y[i]; if(!isFinite(yv)){st=false;return;} const px=X(xv),py=Y(yv); st?c.lineTo(px,py):c.moveTo(px,py); st=true; }); c.stroke(); });
  c.setLineDash([]); c.restore();
  // markers
  const placed=[];
  (o.markers||[]).forEach(k=>{ if(!isFinite(k.x)||!isFinite(k.y)) return; const x=X(k.x),y=Y(k.y); if(x<m.l-1||x>w-m.r+1) return; c.fillStyle=k.color; c.beginPath(); c.arc(x,y,5,0,2*PI); c.fill(); c.strokeStyle='#0b1020'; c.lineWidth=2; c.stroke();
    if(k.label){ c.font='11px "JetBrains Mono", ui-monospace, monospace'; const right=x>w-170, tw=c.measureText(k.label).width; let lx=right?x-9-tw:x+9, ly=y-9;
      for(let it=0;it<6;it++){ const hit=placed.some(b=>lx<b.x+b.w&&lx+tw>b.x&&ly-11<b.y&&ly>b.y-11); if(!hit) break; ly+=16; }
      if(ly-11<m.t) ly=y+18; placed.push({x:lx,y:ly,w:tw}); c.textAlign='left'; c.fillText(k.label,lx,ly);} });
  // legend
  let lx=m.l+8; c.font='12px "Space Grotesk", system-ui, sans-serif'; c.textAlign='left';
  o.series.forEach(s=>{ if(!s.label) return; c.fillStyle=s.color; c.fillRect(lx,8,14,3); c.fillStyle='#c9d4ee'; c.fillText(s.label,lx+19,13); lx+=c.measureText(s.label).width+38; });
}
function barChart(cv,o){
  if(!cv) return;
  const {c,w,h}=prepCanvas(cv); const m={l:58,r:16,t:28,b:34}; const pw=w-m.l-m.r, ph=h-m.t-m.b;
  const all=o.series.flatMap(s=>s.vals); let ymin=Math.min(0,...all), ymax=Math.max(0,...all); if(ymax===ymin) ymax=1;
  const pad=(ymax-ymin)*0.12; ymax+=pad; if(ymin<0) ymin-=pad;
  const Y=v=>m.t+(1-(v-ymin)/(ymax-ymin))*ph;
  c.font='11px "JetBrains Mono", ui-monospace, monospace'; c.strokeStyle='#26314f'; c.fillStyle='#8d99b8';
  for(const t of niceTicks(ymin,ymax,5)){ const y=Y(t); c.beginPath(); c.moveTo(m.l,y); c.lineTo(w-m.r,y); c.stroke(); c.textAlign='right'; c.fillText(eng(t,'',3).trim(),m.l-6,y+4); }
  c.strokeStyle='#4a5a85'; c.beginPath(); c.moveTo(m.l,Y(0)); c.lineTo(w-m.r,Y(0)); c.stroke();
  const G=o.groups.length, gw=pw/G, ns=o.series.length, bw=Math.min(40,gw*0.75/ns);
  o.groups.forEach((g,gi)=>{ const gx=m.l+gi*gw+gw/2-bw*ns/2;
    o.series.forEach((s,si)=>{ const v=s.vals[gi], x=gx+si*bw, y0=Y(0), y1=Y(v); c.fillStyle=s.color; c.fillRect(x+2,Math.min(y0,y1),bw-4,Math.abs(y1-y0)); c.fillStyle='#c9d4ee'; c.font='10px "JetBrains Mono", ui-monospace, monospace'; c.textAlign='center'; c.fillText(eng(v,'',3).trim(),x+bw/2,v>=0?y1-4:y1+12); });
    c.fillStyle='#8d99b8'; c.font='12px "Space Grotesk", system-ui, sans-serif'; c.textAlign='center'; c.fillText(g,m.l+gi*gw+gw/2,h-12); });
  c.save(); c.translate(13,m.t+ph/2); c.rotate(-PI/2); c.textAlign='center'; c.fillText(o.yl||'',0,0); c.restore();
  let lx=m.l+8; c.font='12px "Space Grotesk", system-ui, sans-serif'; c.textAlign='left';
  o.series.forEach(s=>{ c.fillStyle=s.color; c.fillRect(lx,6,12,10); c.fillStyle='#c9d4ee'; c.fillText(s.label,lx+17,15); lx+=c.measureText(s.label).width+34; });
}
const linspace=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const logspace=(a,b,n)=>Array.from({length:n},(_,i)=>10**(Math.log10(a)+(Math.log10(b)-Math.log10(a))*i/(n-1)));

/* ====================== Generic UI builders ====================== */
function buildControls(el,defs,onChange){
  const vals={}; el.innerHTML='';
  defs.forEach(d=>{
    vals[d.k]=d.v;
    const box=document.createElement('div'); box.className='prm'; box.id='p-'+d.k;
    if(d.type==='sel'){
      box.innerHTML=`<label><span id="lbl-${d.k}">${d.label}</span></label><select>${d.opts.map(o=>`<option value="${o[0]}" ${o[0]===d.v?'selected':''}>${o[1]}</option>`).join('')}</select>`;
      box.querySelector('select').onchange=e=>{vals[d.k]=e.target.value; onChange();};
    } else {
      box.innerHTML=`<label><span id="lbl-${d.k}">${d.label}</span></label><div class="row"><input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.v}"><input type="number" step="any" value="${d.v}"><span class="u">${d.unit||''}</span></div>`;
      const r=box.querySelector('input[type=range]'), n=box.querySelector('input[type=number]');
      r.oninput=()=>{vals[d.k]=parseFloat(r.value); n.value=r.value; onChange();};
      n.oninput=()=>{const x=parseFloat(n.value); if(isNaN(x)) return; const lo=d.hardMin!==undefined?d.hardMin:d.min; if(x<lo) return; vals[d.k]=x; r.value=x; onChange();};
      n.onchange=()=>{const x=parseFloat(n.value); const lo=d.hardMin!==undefined?d.hardMin:d.min; if(isNaN(x)||x<lo){n.value=vals[d.k];}};
    }
    el.appendChild(box);
  });
  const api={vals,
    set(k,v){ vals[k]=v; const b=$('p-'+k); if(!b) return; const s=b.querySelector('select'); if(s){s.value=v;return;} b.querySelector('input[type=range]').value=v; b.querySelector('input[type=number]').value=+(+v).toPrecision(5); },
    label(k,t){ const l=$('lbl-'+k); if(l) l.textContent=t; },
    show(k,on){ const b=$('p-'+k); if(b) b.classList.toggle('hide',!on); }
  };
  return api;
}
const results=items=>items.map(([l,v,c])=>`<div class="res ${c||''}"><small>${l}</small><b>${v}</b></div>`).join('');
const steps=items=>`<ol class="steps">${items.map(([t,f])=>`<li><div class="t">${t}</div>${f?`<div class="f">${f}</div>`:''}</li>`).join('')}</ol>`;
function tabsHtml(id,list,on){ return `<div class="tabs" id="${id}">${list.map(([k,l])=>`<button data-k="${k}" class="${k===on?'on':''}">${l}</button>`).join('')}</div>`; }
function bindTabs(id,cb){ const el=$(id); if(!el) return; el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); cb(b.dataset.k);}); }

    if(gen){
      $('chT').innerHTML='<span class="dot"></span>External characteristic: Vt vs Ia';
      $('chN').textContent='Terminal voltage falls as load current rises because of the Ia·Ra drop (armature reaction is ignored).';
      lineChart($('ch1'),{x:is,series:[{y:is.map(()=>E),color:css('--cyan'),label:'Eg',dash:[6,4]},{y:is.map(i=>E-i*v.Ra),color:css('--amber'),label:'Vt'}],xl:'Armature current Ia (A)',yl:'Voltage (V)',markers:[{x:v.Ia,y:Vt,color:css('--pink'),label:'operating point'}]});
    } else {
      $('chT').innerHTML='<span class="dot"></span>Speed characteristic: N vs Ia (constant Φ)';
      $('chN').textContent='At constant flux the speed drops only slightly with load, so the motor runs at nearly constant speed.';
      lineChart($('ch1'),{x:is,series:[{y:is.map(i=>Math.max(0,(v.V-i*v.Ra)/K)),color:css('--amber'),label:'N (rpm)'}],xl:'Armature current Ia (A)',yl:'Speed (rpm)',markers:[{x:v.Ia,y:N,color:css('--pink'),label:'operating point'}]});
    }
  },
  theory:`EMF equation:  E = P·Φ·Z·N / (60·A)      (A = P for lap, A = 2 for wave)
Generator: Vt = Eg − Ia·Ra          Motor: Eb = V − Ia·Ra,  N ∝ Eb/Φ
Torque: T = P·Φ·Z·Ia / (2π·A) = 0.159·(P/A)·Φ·Z·Ia  N·m`
});

/* ---------- 8. Induction motor ---------- */
MODULES.push({
  id:'induction', grp:'Electrical Machines', ic:'IM', title:'Three-Phase Induction Motor: Slip & Torque',
  tag:'Module 4 · AC Machines',
  intro:'The rotating magnetic field turns at synchronous speed N<sub>s</sub> and the rotor turns slightly slower. Change the speed to see slip, rotor frequency, rotor current, torque and the power split. The animation is slowed down so you can see the field moving ahead of the rotor.',
  params:[
    {k:'f',label:'Supply frequency f',unit:'Hz',min:25,max:60,step:1,v:50},
    {k:'P',label:'Number of poles P',unit:'',min:2,max:12,step:2,v:4,hardMin:2},
    {k:'N',label:'Rotor speed N',unit:'rpm',min:0,max:3600,step:5,v:1440},
    {k:'R2',label:'Rotor resistance R₂ (per phase)',unit:'Ω',min:0.01,max:2,step:0.01,v:0.2,hardMin:0.0001},
    {k:'X2',label:'Rotor standstill reactance X₂',unit:'Ω',min:0.1,max:5,step:0.05,v:1,hardMin:0.0001},
    {k:'E2',label:'Rotor standstill EMF E₂ (per phase)',unit:'V',min:10,max:400,step:1,v:100},
  ],
  viz(){return {tabs:[],def:''};},
  chartHtml:`<h3><span class="dot"></span>Torque–speed characteristic</h3><div class="chartwrap"><canvas id="ch1"></canvas></div><div class="note">Maximum torque occurs at slip s<sub>m</sub> = R₂/X₂. Increasing R₂ shifts the peak towards standstill, which gives more starting torque.</div>`,
  actions:[{label:'Set speed for max torque',fn(v,api){ const Ns=120*v.f/v.P, sm=Math.min(1,v.R2/v.X2); api.set('N',+(Ns*(1-sm)).toFixed(1)); }},{label:'Standstill (start)',fn(v,api){api.set('N',0);}}],
  update(v){
    const Ns=120*v.f/v.P, s=(Ns-v.N)/Ns, ws=2*PI*Ns/60;
    const Tf=sl=>3/ws*sl*v.E2**2*v.R2/(v.R2**2+(sl*v.X2)**2);
    const I2=s*v.E2/Math.hypot(v.R2,s*v.X2), T=Tf(s), Pcu=3*I2*I2*v.R2, Pg=T*ws, Pm=(1-s)*Pg;
    const sm=v.R2/v.X2, Tmax=3/ws*v.E2**2/(2*v.X2), Tst=Tf(1);
    const warn=s<=0;
    $('res').innerHTML=results([
      ['Synchronous speed Ns',fx(Ns,1)+' rpm','hl'],['Slip s',fx(s,4)+' ('+fx(s*100,2)+' %)',warn?'warn':'hl'],['Rotor frequency fr = s·f',eng(Math.abs(s*v.f),'Hz')],
      ['Rotor current I₂',eng(Math.abs(I2),'A')],['Torque T',eng(T,'N·m'),'hl'],['Air-gap power Pg',eng(Pg,'W')],
      ['Rotor Cu loss = s·Pg',eng(Pcu,'W')],['Mechanical power (1−s)·Pg',eng(Pm,'W')],
      ['Max torque Tmax',eng(Tmax,'N·m'),'ok'],['Slip at Tmax',fx(sm,3),'ok'],['Starting torque',eng(Tst,'N·m'),'ok']]);
    $('steps').innerHTML=steps([
      ['Synchronous speed',`Ns = 120·f / P = 120 × ${n4(v.f)} / ${v.P} = ${fx(Ns,2)} rpm`],
      ['Slip',`s = (Ns − N)/Ns = (${fx(Ns,1)} − ${n4(v.N)})/${fx(Ns,1)} = ${fx(s,4)}`+(warn?'\n⚠ N ≥ Ns: no torque is produced (s ≤ 0 means generating mode).':'')],
      ['Rotor quantities under running conditions',`fr = s·f = ${eng(s*v.f,'Hz')}\nE₂r = s·E₂ = ${eng(s*v.E2,'V')},  X₂r = s·X₂ = ${eng(s*v.X2,'Ω')}\nI₂ = sE₂ / √(R₂² + (sX₂)²) = ${eng(I2,'A')}`],
      ['Torque (3-phase)',`T = (3/ωs) · s·E₂²·R₂ / (R₂² + (sX₂)²),   ωs = 2πNs/60 = ${n4(ws)} rad/s\nT = ${eng(T,'N·m')}`],
      ['Power flow in the rotor',`Pg : Pcu₂ : Pm = 1 : s : (1 − s)\nPg = ${eng(Pg,'W')},  Pcu₂ = ${eng(Pcu,'W')},  Pm = ${eng(Pm,'W')}`],
      ['Maximum torque',`s_m = R₂/X₂ = ${fx(sm,4)} → N = ${fx(Ns*(1-sm),1)} rpm\nTmax = (3/ωs)·E₂²/(2X₂) = ${eng(Tmax,'N·m')}  (independent of R₂)`]]);
    // animated svg
    const cx=200,cy=150;
    let g=`<circle cx="${cx}" cy="${cy}" r="125" fill="none" stroke="#5a6a95" stroke-width="16"/>`;
    for(let i=0;i<24;i++){const a=i*15/DEG;g+=`<line x1="${cx+117*Math.cos(a)}" y1="${cy+117*Math.sin(a)}" x2="${cx+133*Math.cos(a)}" y2="${cy+133*Math.sin(a)}" stroke="#0b1020" stroke-width="3"/>`;}
    g+=`<circle cx="${cx}" cy="${cy}" r="80" fill="var(--bg2)" stroke="var(--text)" stroke-width="2"/>`;
    g+=`<g id="fieldG">${S.arrow(cx,cy,cx+108,cy,css('--cyan'),4,'')}<text class="sc" x="${cx+60}" y="${cy-8}" text-anchor="middle">B (Ns)</text></g>`;
    g+=`<g id="rotorG">${Array.from({length:8},(_,i)=>{const a=i*45/DEG;return `<circle cx="${cx+66*Math.cos(a)}" cy="${cy+66*Math.sin(a)}" r="6" fill="${i===0?'var(--amber)':'#5a6a95'}"/>`;}).join('')}<line x1="${cx}" y1="${cy}" x2="${cx+56}" y2="${cy}" stroke="var(--amber)" stroke-width="3"/></g>`;
    g+=`<circle cx="${cx}" cy="${cy}" r="8" fill="var(--amber)"/>`;
    g+=S.txt(400,70,'Stator field: Ns = '+fx(Ns,0)+' rpm','sc','start')+S.txt(400,95,'Rotor: N = '+fx(v.N,0)+' rpm','sv','start')+S.txt(400,120,'Slip s = '+fx(s*100,2)+' %','sg','start');
    g+=S.txt(400,160,'Relative speed (Ns − N) = '+fx(Ns-v.N,0)+' rpm','sm','start')+S.txt(400,182,'The rotor "slips" behind the field;','sm','start')+S.txt(400,200,'this relative motion induces','sm','start')+S.txt(400,218,'the rotor current.','sm','start')+S.txt(400,250,'(animation slowed ×60)','sm','start');
    $('viz').innerHTML=S.svg(700,300,g);
    cancelAnimationFrame(animId); let af=0,ar=0,last=performance.now();
    const fG=$('fieldG'),rG=$('rotorG');
    const tick=t=>{const dt=(t-last)/1000;last=t; af+=Ns/60*360/60*dt; ar+=v.N/60*360/60*dt; if(fG){fG.setAttribute('transform',`rotate(${af%360} ${cx} ${cy})`);rG.setAttribute('transform',`rotate(${ar%360} ${cx} ${cy})`);} animId=requestAnimationFrame(tick);};
    animId=requestAnimationFrame(tick);
    const ns=linspace(0,Ns*0.9999,300);
    lineChart($('ch1'),{x:ns,series:[{y:ns.map(n=>Tf((Ns-n)/Ns)),color:css('--amber'),label:'Torque (N·m)'}],xl:'Rotor speed N (rpm)   [s = 1 at left, s = 0 at Ns]',yl:'Torque (N·m)',
      markers:[{x:Ns*(1-Math.min(1,sm)),y:Tf(Math.min(1,sm)),color:css('--green'),label:'Tmax'},{x:Math.min(v.N,Ns*0.9999),y:warn?0:T,color:css('--pink'),label:'operating point'}]});
  },
  theory:`Ns = 120 f / P,   s = (Ns − N)/Ns,   fr = s·f
T = (3/ωs) · s E₂² R₂ / (R₂² + (s X₂)²)
Tmax at s_m = R₂/X₂;   Tmax = (3/ωs) · E₂² / (2 X₂)
Pg : Rotor Cu loss : Pm = 1 : s : (1 − s)`
});

/* ====================== Home & routing ====================== */
const DESC={thevenin:'Find Vth, Rth and IN for any values, and see where maximum power transfer occurs on a live curve.',
mesh:'Solve a two-source network with KCL, KVL and superposition, and check that all three agree.',
stardelta:'Convert Δ ↔ Y networks and verify that the terminal resistances are equal.',
rlc:'Reactance, impedance, power factor, phasor diagram and the resonance curve.',
threephase:'Star and delta loads, line and phase values, three-phase power and the two-wattmeter method.',
transformer:'OC/SC tests, equivalent circuit, efficiency, maximum efficiency and voltage regulation.',
dcmachine:'EMF equation for lap and wave windings, terminal voltage, back EMF, speed and torque.',
induction:'Synchronous speed, slip, rotor frequency and the torque–slip characteristic, with an animated field.'};
function home(){
  cancelAnimationFrame(animId);
  let name='Your Name', roll='Roll No.', inst='Institute / Department';
  try{ const d=JSON.parse(localStorage.getItem('bee-meta')||'{}'); name=d.name||name; roll=d.roll||roll; inst=d.inst||inst; }catch(e){}
  $('view').innerHTML=`
  <div class="hero">
    <div class="mhead" style="margin:0"><div><div class="tag" style="color:var(--amber);font-family:var(--mono);font-size:12px;letter-spacing:1px">CAPSTONE PROJECT · BASIC ELECTRICAL ENGINEERING</div></div></div>
    <h1 style="margin-top:10px">BEE <em>Virtual Lab</em>: an interactive simulator for circuits & machines</h1>
    <p>Eight live simulators covering the BEE syllabus: DC network theorems, AC circuits, three-phase systems, transformers and electrical machines. Change any parameter and the circuit diagram, results, step-by-step solution and graphs all update instantly.</p>
    <div class="meta"><div><span>Presented by: </span><b contenteditable="true" id="mName">${name}</b></div><div><span>Roll: </span><b contenteditable="true" id="mRoll">${roll}</b></div><div><span></span><b contenteditable="true" id="mInst">${inst}</b></div></div>
    <div class="btns" style="margin-top:20px"><button class="btn pri" onclick="go('thevenin')">Start with Thevenin's theorem →</button></div>
    <svg class="wave" viewBox="0 0 420 160"><path d="${Array.from({length:211},(_,i)=>`${i?'L':'M'}${i*2} ${80-55*Math.sin(i/14)}`).join(' ')}" fill="none" stroke="#ffb84d" stroke-width="2"/><path d="${Array.from({length:211},(_,i)=>`${i?'L':'M'}${i*2} ${80-55*Math.sin(i/14-2.09)}`).join(' ')}" fill="none" stroke="#4fd1e8" stroke-width="2"/><path d="${Array.from({length:211},(_,i)=>`${i?'L':'M'}${i*2} ${80-55*Math.sin(i/14-4.19)}`).join(' ')}" fill="none" stroke="#ff6b9a" stroke-width="2"/></svg>
  </div>
  <div class="mcards">${MODULES.map((m,i)=>`<div class="mc" onclick="go('${m.id}')"><div class="k">${String(i+1).padStart(2,'0')} · ${m.grp}</div><h3>${m.title}</h3><p>${DESC[m.id]}</p></div>`).join('')}</div>
  <div class="card" style="margin-top:20px"><h3><span class="dot"></span>Features</h3>
  <div class="feat" style="margin-top:4px">
    <div><b>Live circuit diagrams</b><span>Animated current flow; the dot speed and direction follow the actual current.</span></div>
    <div><b>Step-by-step solutions</b><span>Every answer is worked out with the formula and the numbers substituted in, just as you would write it in an exam.</span></div>
    <div><b>Interactive graphs</b><span>Power transfer curve, resonance curve, efficiency curve, torque–slip curve and more.</span></div>
    <div><b>Verification</b><span>Power balance, star–delta equivalence and W1 + W2 = P checks confirm that the results are correct.</span></div>
    <div><b>No installation</b><span>Pure HTML, CSS and JavaScript with no external libraries. Works in any browser, on desktop or phone.</span></div>
  </div></div>`;
  const save=()=>{ try{ localStorage.setItem('bee-meta',JSON.stringify({name:$('mName').textContent,roll:$('mRoll').textContent,inst:$('mInst').textContent})); }catch(e){} };
  ['mName','mRoll','mInst'].forEach(id=>$(id).addEventListener('input',save));
}
function renderModule(m){
  cancelAnimationFrame(animId);
  const vz=m.viz();
  $('view').innerHTML=`
  <div class="mhead"><div><div class="tag">${m.tag}</div><h2>${m.title}</h2><p>${m.intro}</p></div></div>
  <div class="g-top">
    <div class="card"><h3><span class="dot"></span>Parameters</h3><div class="ctl" id="ctl"></div>
      <div class="btns" style="margin-top:14px">${(m.actions||[]).map((a,i)=>`<button class="btn pri" data-a="${i}">${a.label}</button>`).join('')}<button class="btn" id="rst">Reset values</button></div></div>
    <div class="card viz"><div class="vizhead"><h3 style="margin:0"><span class="dot"></span>Circuit</h3>${vz.tabs.length?tabsHtml('vt',vz.tabs,vz.def):''}</div><div id="viz"></div></div>
  </div>
  <div class="card"><h3><span class="dot"></span>Results</h3><div class="results" id="res"></div></div>
  <div class="g-bot">
    <div class="card"><h3><span class="dot"></span>Step-by-step solution</h3><div id="steps"></div></div>
    <div class="card">${m.chartHtml}</div>
  </div>
  <details class="card theory" open><summary>Key formulas</summary><div class="f">${m.theory}</div></details>`;
  let view=vz.def;
  const defs=m.params.map(p=>({...p}));
  const upd=()=>{ try{ m.update(api.vals,view); }catch(e){ console.error(e); } };
  const api=buildControls($('ctl'),defs,upd);
  current={m,api,rerender:upd};
  bindTabs('vt',k=>{view=k;upd();});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ m.actions[+b.dataset.a].fn(api.vals,api); upd(); });
  $('rst').onclick=()=>renderModule(m);
  upd();
}
function buildNav(){
  let h=`<div class="brand" onclick="go('home')"><div class="logo">⚡</div><div><b>BEE Virtual Lab</b><small>Interactive simulator</small></div></div>`;
  h+=`<a class="navlink" data-id="home" onclick="go('home')"><span class="ic">⌂</span>Home</a>`;
  let grp='';
  MODULES.forEach(m=>{ if(m.grp!==grp){grp=m.grp;h+=`<div class="navgrp">${grp}</div>`;} h+=`<a class="navlink" data-id="${m.id}" onclick="go('${m.id}')"><span class="ic">${m.ic}</span>${m.title.split(':')[0].replace(' & Max Power Transfer',' & MPT').replace(' & Two-Wattmeter Method','')}</a>`; });
  $('side').innerHTML=h;
}
function go(id){ if(location.hash.slice(1)!==id){ location.hash=id; } else route(); $('side').classList.remove('open'); }
function route(){
  const id=location.hash.slice(1)||'home';
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const m=MODULES.find(x=>x.id===id);
  if(m) renderModule(m); else { current=null; home(); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(current) current.rerender(); },120);});
$('menuBtn').onclick=()=>$('side').classList.toggle('open');
buildNav(); route();
</script>
